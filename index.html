        function setupEventListeners() {

            if (pdfBtn) {
                pdfBtn.addEventListener('click', generatePDFExport);

        // Fonction de génération et téléchargement du PDF
        function generatePDFExport() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Calcul des données
            const dailyAmount = 3; // 3€ par jour
            const totalDays = 365;
            const targetTotal = dailyAmount * totalDays;
           
            // Récupération des jours cochés (depuis localStorage ou state global)
            const savedDays = JSON.parse(localStorage.getItem('savedDays') || '[]');
            const checkedCount = savedDays.length;
            const totalSaved = checkedCount * dailyAmount;
            const remainingAmount = targetTotal - totalSaved;
            const progressPercentage = Math.round((checkedCount / totalDays) * 100);

            // En-tête / Header
            doc.setFillColor(16, 185, 129); // Couleur Emerald-500
            doc.rect(0, 0, 210, 25, 'F');
           
            doc.setTextColor(255, 255, 255);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("Bilan d'Épargne - 3€ par Jour", 14, 16);

            // Date du rapport
            const today = new Date().toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text(`Généré le : ${today}`, 196, 16, { align: 'right' });

            // Synthèse Global (Bloc de statistiques)
            doc.setTextColor(30, 41, 59);
            doc.setFontSize(12);
            doc.setFont("helvetica", "bold");
            doc.text("Résumé du Défi", 14, 38);

            doc.setDrawColor(226, 232, 240);
            doc.setFillColor(248, 250, 252);
            doc.roundedRect(14, 43, 182, 32, 3, 3, 'FD');

            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Total épargné :`, 20, 53);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(16, 185, 129);
            doc.text(`${totalSaved} € / ${targetTotal} € (${progressPercentage}%)`, 60, 53);

            doc.setTextColor(30, 41, 59);
            doc.setFont("helvetica", "normal");
            doc.text(`Jours validés :`, 20, 62);
            doc.setFont("helvetica", "bold");
            doc.text(`${checkedCount} sur ${totalDays} jours`, 60, 62);

            doc.setFont("helvetica", "normal");
            doc.text(`Reste à épargner :`, 20, 70);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(225, 29, 72);
            doc.text(`${remainingAmount} €`, 60, 70);

            // Préparation des données du tableau détaillé
            const tableRows = [];
            for (let i = 1; i <= totalDays; i++) {
                const isChecked = savedDays.includes(i);
                tableRows.push([
                    `Jour ${i}`,
                    `${dailyAmount} €`,
                    isChecked ? "Validé" : "En attente",
                    `${i * dailyAmount} €`
                ]);
            }

            // Génération du tableau avec AutoTable
            doc.autoTable({
                startY: 83,
                head: [['Jour', 'Montant', 'Statut', 'Cumul Atteint']],
                body: tableRows,
                theme: 'striped',
                headStyles: {
                    fillColor: [16, 185, 129],
                    textColor: [255, 255, 255],
                    fontStyle: 'bold'
                },
                columnStyles: {
                    0: { cellWidth: 35 },
                    1: { cellWidth: 35 },
                    2: { cellWidth: 50, fontStyle: 'bold' },
                    3: { cellWidth: 45, halign: 'right' }
                },
                didParseCell: function(data) {
                    if (data.column.index === 2 && data.cell.section === 'body') {
                        if (data.cell.raw === 'Validé') {
                            data.cell.styles.textColor = [16, 185, 129];
                        } else {
                            data.cell.styles.textColor = [148, 163, 184];
                        }
                    }
                }
            });

            // Pied de page (Pagination)
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184);
                doc.text(
                    `Page ${i} sur ${pageCount} - Épargne 3€/jour`,
                    105,
                    290,
                    { align: 'center' }
                );
            }

            // Téléchargement du fichier
            doc.save(`epargne-3euros-bilan-${new Date().toISOString().slice(0, 10)}.pdf`);
           
            if (typeof showToast === 'function') {
                showToast("Fichier PDF téléchargé avec succès !");
            }
        }
