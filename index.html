
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Épargne 3 € / jour</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 { margin: 0 0 6px 0; font-size: 1.5rem; color: var(--text); }
    header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .total-title {
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .total-amount {
      font-size: 2.25rem;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 16px 0;
      color: var(--primary);
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .stat-label { color: var(--muted); }
    .stat-value { font-weight: 600; }
    .btn-export {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 16px;
      border-radius: 8px;
    }
    .month-block {
      margin-bottom: 16px;
    }
    .month-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      aspect-ratio: 1;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .day-cell.checked {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
      font-weight: 700;
    }
    footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 24px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌿 Épargne 3 € / jour</h1>
    <p>3 € chaque jour, toute l'année</p>
  </header>

  <div class="card">
    <div class="total-title">Total mis de côté cette année</div>
    <div class="total-amount" id="totalVal">0,00 €</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="card stats-grid">
    <div class="stat-box"><span class="stat-label">Jours validés</span><span class="stat-value" id="daysVal">0</span></div>
    <div class="stat-box"><span class="stat-label">Objectif annuel</span><span class="stat-value">1 095 €</span></div>
    <div class="stat-box"><span class="stat-label">Reste à mettre</span><span class="stat-value" id="restVal">1 095 €</span></div>
    <div class="stat-box"><span class="stat-label">Cette semaine</span><span class="stat-value" id="weekVal">0 €</span></div>
  </div>

  <button class="btn-export" id="pdfBtn">📄 Exporter le bilan en PDF</button>

  <div class="card" id="monthsContainer">
    <!-- Les mois s'afficheront ici -->
  </div>

  <footer>Données enregistrées sur ton téléphone — fonctionne hors ligne</footer>
</div>
