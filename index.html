
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8c5b9">
<title>Épargne 3 € / jour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f2f7f4;
    --card: #ffffff;
    --green: #7fb8a4;
    --green-dark: #4e8a74;
    --blue: #a9c4d9;
    --sand: #e8dcc9;
    --text: #2f4a41;
    --muted: #6b857c;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef5f1 0%, #f6f2ec 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 32px;
  }
  header {
    padding: calc(18px + env(safe-area-inset-top)) 20px 10px;
    text-align: center;
  }
  header h1 { font-size: 22px; font-weight: 600; color: var(--green-dark); }
  header p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .wrap { max-width: 420px; margin: 0 auto; padding: 0 16px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 14px;
    box-shadow: 0 4px 14px rgba(79, 138, 116, .10);
  }

  .total-label { font-size: 13px; color: var(--muted); text-align: center; }
  .total {
    font-size: 40px; font-weight: 700; text-align: center;
    color: var(--green-dark); margin-top: 6px;
  }
  .sub { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }

  .row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px; }
  .row + .row { border-top: 1px solid #edf3f0; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; }

  button {
    display: block; width: 100%; margin-top: 14px;
    background: var(--green); color: #fff; border: none;
    border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button:active { background: var(--green-dark); }
  button.ghost { background: transparent; color: var(--green-dark); }
  button:disabled { background: var(--sand); color: var(--green-dark); }

  .progress {
    height: 10px; background: #e7efeb;
    border-radius: 6px; overflow: hidden; margin-top: 12px;
  }
  .progress > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--green), var(--blue));
    border-radius: 6px; transition: width .4s ease;
  }

  .days {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px; margin-top: 12px;
  }
  .day {
    aspect-ratio: 1; border-radius: 8px; background: #eef4f1;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--muted);
  }
  .day.done { background: var(--green); color: #fff; }
  .day.today { outline: 2px solid var(--green-dark); font-weight: 700; }

  .cal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px;
  }
  .cal-head button {
    width: auto; margin: 0; padding: 8px 20px;
    background: var(--sand); color: var(--text);
    border-radius: 10px; font-size: 20px; font-weight: 700;
  }
  .cal-title { font-size: 15px; font-weight: 600; }

  .history { margin-top: 8px; }
  .hist-item { display: flex; justify-content: space-between; padding: 9px 0; font-size: 14px; border-bottom: 1px solid #edf3f0; }

  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
</style>
</head>
<body>
<header>
  <h1>🌿 Épargne 3 € / jour</h1>
  <p>3 € chaque jour, toute l'année</p>
</header>

<div class="wrap">

  <div class="card">
    <div class="total-label">Total mis de côté cette année</div>
    <div class="total" id="total">0,00 €</div>
    <div class="sub" id="objective"></div>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <div class="card">
    <div class="row"><span class="k">Jours validés</span><span class="v" id="daysCount">0</span></div>
    <div class="row"><span class="k">Objectif annuel (365 j)</span><span class="v">1 095 €</span></div>
    <div class="row"><span class="k">Reste à mettre de côté</span><span class="v" id="remain">1 095 €</span></div>
    <div class="row"><span class="k">Cette semaine</span><span class="v" id="week">0 €</span></div>
    <button id="addBtn">+ J'ai mis mes 3 € de côté aujourd'hui</button>
    <button class="ghost" id="undoBtn">Annuler le dernier jour</button>
  </div>

  <div class="card">
    <div class="cal-title" style="text-align:center;margin-bottom:6px">Calendrier</div>
    <div class="cal-head">
      <button id="prevMonth">◀</button>
      <span class="cal-title" id="monthLabel"></span>
      <button id="nextMonth">▶</button>
    </div>
    <div class="days" id="dow"></div>
    <div class="days" id="calendar"></div>
  </div>

  <div class="card">
    <div class="cal-title" style="text-align:center;margin-bottom:4px">Historique</div>
    <div class="history" id="history"></div>
    <button class="ghost" id="resetBtn">Réinitialiser l'année</button>
  </div>

  <footer>Données enregistrées sur ton téléphone — fonctionne hors ligne</footer>
</div>

<script>
const DAILY = 3;
const YEAR = new Date().getFullYear();
const KEY = 'epargne-' + YEAR;
let days = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
let calDate = new Date();

const fmt = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 2 }) + ' €';
const iso = d => d.toISOString().slice(0, 10);
const today = iso(new Date());

function save() {
  localStorage.setItem(KEY, JSON.stringify([...days]));
}
function total() { return days.size * DAILY; }

function render() {
  const t = total();
  document.getElementById('total').textContent = fmt(t);
  document.getElementById('daysCount').textContent = days.size;
  const goal = 365 * DAILY;
  document.getElementById('remain').textContent = fmt(Math.max(0, goal - t));
  const pct = Math.min(100, (t / goal * 100)).toFixed(1);
  document.getElementById('objective').textContent = pct + ' % de l\'objectif annuel';
  document.getElementById('bar').style.width = pct + '%';

  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  let weekSum = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    if (days.has(iso(d))) weekSum += DAILY;
  }
  document.getElementById('week').textContent = fmt(weekSum);
  document.getElementById('addBtn').disabled = days.has(today);
  document.getElementById('addBtn').textContent = days.has(today)
    ? '✓ Jour déjà validé — à toi demain !'
    : "+ J'ai mis mes 3 € de côté aujourd'hui";
  renderCal();
  renderHistory();
}

function renderCal() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('monthLabel').textContent =
    calDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  const dowEl = document.getElementById('dow');
  dowEl.innerHTML = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="day">${d}</div>`).join('');
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const nb = new Date(y, m + 1, 0).getDate();
  let html = '';
  for (let i = 0; i < offset; i++) html += '<div></div>';
  for (let d = 1; d <= nb; d++) {
    const ds = iso(new Date(y, m, d));
    const cls = ['day'];
    if (days.has(ds)) cls.push('done');
    if (ds === today) cls.push('today');
    html += `<div class="${cls.join(' ')}">${d}</div>`;
  }
  document.getElementById('calendar').innerHTML = html;
}

function renderHistory() {
  const list = [...days].sort().reverse().slice(0, 15);
  document.getElementById('history').innerHTML = list.length
    ? list.map(d => `<div class="hist-item"><span>${new Date(d + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</span><span>3 €</span></div>`).join('')
    : '<p style="text-align:center;color:var(--muted);font-size:14px;padding:10px">Aucun jour validé pour le moment.</p>';
}

document.getElementById('addBtn').onclick = () => { days.add(today); save(); render(); };
document.getElementById('undoBtn').onclick = () => {
  const last = [...days].sort().pop();
  if (last) { days.delete(last); save(); render(); }
};
document.getElementById('resetBtn').onclick = () => {
  if (confirm('Effacer tous les jours validés de ' + YEAR + ' ?')) { days.clear(); save(); render(); }
};
document.getElementById('prevMonth').onclick = () => { calDate.setMonth(calDate.getMonth() - 1); renderCal(); };
document.getElementById('nextMonth').onclick = () => { calDate.setMonth(calDate.getMonth() + 1); renderCal(); };

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
